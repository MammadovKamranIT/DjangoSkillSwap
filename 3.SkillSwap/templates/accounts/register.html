{% extends 'base.html' %}

{% block title %}
	Register
{% endblock %}

{% block content %}
	<h1>New User</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <fieldset>
        <legend>Register</legend>
        {{ form.as_p }}
        {{ profile_form.as_p }}
        </fieldset>
        <button type="submit">Register</button>
    </form>
{% endblock %}
