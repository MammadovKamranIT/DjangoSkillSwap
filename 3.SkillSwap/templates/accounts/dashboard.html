{%extends "base.html"%}
{%block title%}
Dashboard
{%endblock%}


{%block content%}

<h1>Dashboard</h1>
<h2>User: {{active_user}}</h2>
<div class="profile-container">
    <!-- Renders the Cloudinary hosted URL -->
    <img src="{{ active_user.profile.avatar.url }}" alt="{{ active_user.username }}'s avatar" class="avatar-img">
    
    <h3>{{ active_user.username }}</h3>
    <p>{{ active_user.profile.bio }}</p>
</div>

<div class="actions">
<a  class="action-link" href="{% url "offers:offers_create" %}">Create offer</a>

<a  class="action-link"  href="{% url 'offers:offers_list' source='link_d' %}">Offers List</a>

<a  class="action-link"  href="{% url "home" %}">Return to home page</a>
</div>
{%endblock content%}
